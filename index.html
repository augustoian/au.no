<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha Seguro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="conteudo">
        <!-- Cabeçalho -->
        <header class="conteudo-titulo">
            <img src="mi.jpeg" alt="Ícone de cadeado" class="titulo-icone">
            <h1 class="titulo-principal">Gerador de Senhas</h1>
            <p class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura</p>
        </header>

        <!-- Display da Senha Gerada -->
        <section class="conteudo-senha card">
            <label for="campo-senha" class="conteudo-senha__label">Senha gerada</label>
            <div class="conteudo-senha__box">
                <input name="senha" type="text" id="campo-senha" readonly placeholder="Sua senha aparecerá aqui">
                <div class="acoes-senha">
                    <button type="button" id="btn-copiar" class="btn-acao" title="Copiar senha">Copiar</button>
                    <button type="button" id="btn-gerar" class="btn-acao btn-icone" title="Gerar nova senha">↻</button>
                </div>
            </div>
        </section>

        <!-- Painel de Configurações -->
        <section class="parametro card">
            <h2 class="parametro-titulo">Personalize sua senha</h2>
            
            <div class="parametro-grid">
                <!-- Controle de Tamanho -->
                <div class="parametro-item">
                    <h3 class="parametro-item__titulo">Número de caracteres</h3>
                    <div class="parametro-senha-botoes">
                        <button type="button" id="btn-diminuir" class="parametro-senha__botao" aria-label="Diminuir tamanho">-</button>
                        <span id="tamanho-texto" class="parametro-senha__texto">12</span>
                        <button type="button" id="btn-aumentar" class="parametro-senha__botao" aria-label="Aumentar tamanho">+</button>
                    </div>
                </div>

                <!-- Características / Filtros -->
                <div class="parametro-item">
                    <h3 class="parametro-item__titulo">Características</h3>
                    <div class="parametro-checkboxes">
                        <label class="checkbox-label">
                            <input type="checkbox" id="chk-maiusculas" checked>
                            Letras maiúsculas (A-Z)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="chk-minusculas" checked>
                            Letras minúsculas (a-z)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="chk-numeros" checked>
                            Números (0-9)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="chk-simbolos" checked>
                            Símbolos (!@#$)
                        </label>
                    </div>
                </div>

                <!-- Indicador de Força -->
                <div class="parametro-item">
                    <h3 class="parametro-item__titulo">Força da senha</h3>
                    <div class="forca-container">
                        <div class="barra-forca">
                            <div id="forca-indicador" class="forca-indicador"></div>
                        </div>
                        <span id="forca-rotulo" class="forca-rotulo">Forte</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="main.js" defer></script>
</body>

</html>
